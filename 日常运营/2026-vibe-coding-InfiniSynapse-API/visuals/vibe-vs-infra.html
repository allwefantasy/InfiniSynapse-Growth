<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { width: 1080px; margin: 0; padding: 48px; font-family: -apple-system, "PingFang SC", sans-serif; background: #fff; }
  </style>
</head>
<body>
  <div class="text-center mb-8">
    <div class="text-3xl font-bold text-slate-900">Vibe Coding 只写壳，Data Infra 谁来接？</div>
  </div>
  <div class="grid grid-cols-3 gap-4">
    <div class="bg-gray-50 rounded-2xl p-6 border border-gray-200">
      <div class="text-xs uppercase tracking-widest text-gray-400 mb-3">只有 Vibe Coding</div>
      <div class="space-y-3 text-sm text-gray-700">
        <div>✓ 表单 / 小程序页面</div>
        <div>✓ 进度条 UI</div>
        <div class="text-red-600">✗ 多源数据接入</div>
        <div class="text-red-600">✗ 长任务 + SSE</div>
        <div class="text-red-600">✗ PDF / 工作区导出</div>
        <div class="text-red-600">✗ 来源追溯与记忆</div>
      </div>
    </div>
    <div class="bg-slate-900 text-white rounded-2xl p-6 col-span-1">
      <div class="text-xs uppercase tracking-widest opacity-60 mb-3">+ InfiniSynapse API</div>
      <div class="space-y-3 text-sm">
        <div>✓ 你专注场景与方法论</div>
        <div>✓ Agent 长任务托管</div>
        <div>✓ 数据源 / RAG / Skill</div>
        <div>✓ 浏览器 / 搜索 / 文件</div>
        <div>✓ 报告工作区 + 下载</div>
        <div>✓ 任务可恢复、可分享</div>
      </div>
    </div>
    <div class="bg-orange-50 rounded-2xl p-6 border-2 border-orange-300">
      <div class="text-xs uppercase tracking-widest text-orange-600 mb-3">你真正要回答的 3 个问题</div>
      <div class="space-y-4 text-sm text-orange-900">
        <div><span class="font-bold">1.</span> 用户填什么？约束是什么？</div>
        <div><span class="font-bold">2.</span> 打开哪些数据、文件、搜索能力？</div>
        <div><span class="font-bold">3.</span> 最终交付 PDF、表格还是清单？</div>
      </div>
    </div>
  </div>
</body>
</html>
