<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="_table-base.css">
  <style>td:first-child { width: 38%; }</style>
</head>
<body>
  <div class="card">
    <div class="title">最容易被忽视的退档坑</div>
    <div class="subtitle">选科 · 专业组 · 调剂——三项填错，分数够也可能录不上</div>
    <table>
      <thead>
        <tr><th>坑</th><th>后果</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>专业组选科要求填错</td>
          <td>新高考省份，选科不匹配 = <span class="em">直接退档</span></td>
        </tr>
        <tr>
          <td>不看招生章程，按学校名填</td>
          <td>同校不同专业组，分数线和选科要求完全不同</td>
        </tr>
        <tr>
          <td>冲刺校勾「服从调剂」，但没设底线</td>
          <td>录是录了，专业被调剂到完全不能接受的</td>
        </tr>
        <tr>
          <td>不服从调剂又去冲热门组</td>
          <td>分数够线但专业录满，<span class="em">退档</span></td>
        </tr>
      </tbody>
    </table>
    <div class="footnote">招生章程以 2026 各校最新版为准；数据只信阳光高考、省考试院、高校招生网</div>
  </div>
</body>
</html>
