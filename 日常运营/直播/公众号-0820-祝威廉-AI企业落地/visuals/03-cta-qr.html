<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    margin: 0;
    padding: 56px;
    font-family: Georgia, "Source Han Serif SC", "PingFang SC", serif;
    background: #fff;
    color: #111;
  }
  .box {
    width: fit-content;
    margin: 0 auto;
    border-top: 2px solid #111;
    border-bottom: 1px solid #111;
    padding: 24px 28px 20px;
  }
  .wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 36px;
  }
  .col { text-align: center; width: 220px; }
  .col img {
    width: 196px; height: 196px;
    object-fit: contain;
    background: #fff;
    display: block;
    margin: 0 auto 10px;
  }
  .cap {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .sub { margin-top: 4px; font-size: 14px; color: #666; }
  .gift {
    margin-top: 18px;
    text-align: center;
    font-size: 17px;
    color: #326891;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="wrap">
      <div class="col">
        <img src="../images/qr-reserve.png" alt="预约直播">
        <div class="cap">预约直播</div>
        <div class="sub">微信扫码 · 开播提醒</div>
      </div>
      <div class="col">
        <img src="../images/qr-group.png" alt="进群领会员">
        <div class="cap">进群领会员</div>
        <div class="sub">种子群 · 不单场解散</div>
      </div>
    </div>
  </div>
  <div class="gift">进群领取 InfiniSynapse 月度会员 · 价值 ¥150</div>
</body>
</html>
