<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #12151d;
    --muted: #556068;
    --teal: #0f958f;
    --teal-deep: #0b7a75;
    --line: rgba(15, 149, 143, 0.28);
  }
  html, body {
    width: 1080px;
    height: 1440px;
    background: #fff;
    overflow: hidden;
  }
  .cover {
    position: relative;
    width: 1080px;
    height: 1440px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 50% at 80% 18%, rgba(15,149,143,0.14) 0%, transparent 62%),
      linear-gradient(180deg, #f7fafb 0%, #eef4f4 58%, #dcecea 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
  }
  .accent {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 12px;
    background: var(--teal);
  }
  .inner {
    height: 100%;
    padding: 72px 64px 56px 76px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .top img { height: 46px; width: auto; display: block; object-fit: contain; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 18px;
    border-radius: 999px;
    background: var(--teal);
    color: #fff;
    font-size: 22px;
    font-weight: 700;
  }
  h1 {
    margin-top: 48px;
    font-size: 72px;
    font-weight: 800;
    line-height: 1.16;
    letter-spacing: 0.5px;
  }
  h1 .ai { color: var(--teal); }
  .who {
    margin-top: 22px;
    font-size: 30px;
    font-weight: 600;
    color: #2a3138;
  }
  .when {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 28px;
    font-weight: 700;
    color: var(--teal-deep);
  }
  .points {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .point {
    display: flex;
    align-items: center;
    gap: 20px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 18px;
    padding: 22px 24px;
  }
  .n {
    width: 48px; height: 48px; flex: 0 0 48px;
    border-radius: 12px;
    background: #e8f6f5;
    color: var(--teal-deep);
    font-size: 22px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .point h3 { font-size: 32px; font-weight: 800; line-height: 1.2; }
  .point p { margin-top: 4px; font-size: 22px; color: var(--muted); font-weight: 500; line-height: 1.35; }
  .foot {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--teal);
    color: #fff;
    border-radius: 18px;
    padding: 22px 28px;
  }
  .foot b { display: block; font-size: 28px; font-weight: 800; }
  .foot span { display: block; margin-top: 4px; font-size: 20px; opacity: 0.92; font-weight: 600; }
  .foot .tag {
    flex: 0 0 auto;
    background: #fff;
    color: var(--teal-deep);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 22px;
    font-weight: 800;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="accent"></div>
    <div class="inner">
      <div class="top">
        <img src="logo-light.png" alt="InfiniSynapse">
        <span class="badge">微信视频号直播</span>
      </div>
      <h1>20年资深数据工程师<br>聊 <span class="ai">AI</span> 企业落地</h1>
      <div class="who">祝威廉｜InfiniSynapse 联创</div>
      <div class="when">8/20 周四 · 19:00–20:00</div>
      <div class="points">
        <div class="point">
          <div class="n">01</div>
          <div>
            <h3>数据脏怎么办</h3>
            <p>未治理也能先直连、先提问，SQL 和血缘可核</p>
          </div>
        </div>
        <div class="point">
          <div class="n">02</div>
          <div>
            <h3>落地从哪一步开始</h3>
            <p>1 个业务问题 + 1～2 个已有库，不用先建仓</p>
          </div>
        </div>
        <div class="point">
          <div class="n">03</div>
          <div>
            <h3>怎样才算真正提效</h3>
            <p>口径对齐一次就能复用，结果敢信、少返工</p>
          </div>
        </div>
      </div>
      <div class="foot">
        <div>
          <b>进群领 InfiniSynapse 月度会员</b>
          <span>详情看评论区 · 微信视频号见</span>
        </div>
        <div class="tag">价值 ¥150</div>
      </div>
    </div>
  </div>
</body>
</html>
