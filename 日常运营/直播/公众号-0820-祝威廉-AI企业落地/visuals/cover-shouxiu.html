<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #12151d;
    --teal: #0f958f;
    --teal-deep: #0b7a75;
  }
  html, body {
    width: 1410px;
    height: 600px;
    background: #fff;
    overflow: hidden;
  }
  .cover {
    position: relative;
    width: 1410px;
    height: 600px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 56% 80% at 86% 48%, rgba(15,149,143,0.16) 0%, transparent 64%),
      linear-gradient(105deg, #f7fafb 0%, #eef4f4 62%, #dcecea 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
  }
  .accent {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 10px;
    background: var(--teal);
  }
  .copy {
    position: relative;
    z-index: 3;
    height: 100%;
    padding: 56px 88px 52px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }
  .top img { height: 48px; width: auto; display: block; object-fit: contain; }
  .badge {
    display: inline-flex;
    align-items: center;
    height: 34px;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--teal);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
  }
  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--teal-deep);
  }
  .kicker::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--teal);
  }
  h1 {
    font-size: 68px;
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: 0.5px;
  }
  h1 .ai { color: var(--teal); }
  .who {
    margin-top: 20px;
    font-size: 28px;
    font-weight: 600;
    color: #2a3138;
  }
  .when {
    margin-top: 24px;
    font-size: 26px;
    font-weight: 700;
    color: var(--teal-deep);
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="accent"></div>
    <div class="copy">
      <div class="top">
        <img src="logo-light.png" alt="InfiniSynapse">
        <span class="badge">微信视频号直播</span>
      </div>
      <div class="kicker">重磅首秀 · 企业版</div>
      <h1>探索和看板<br>终于合在一块</h1>
      <div class="who">祝威廉｜InfiniSynapse 联创</div>
      <div class="when">8/20 周四 · 19:00–20:00</div>
    </div>
  </div>
</body>
</html>
