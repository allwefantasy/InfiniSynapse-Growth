<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; margin: 0; background: #fff; }
  .card {
    width: 1080px;
    height: 420px;
    background: #1a2740;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Source Han Serif SC", "PingFang SC", serif;
  }
  .play {
    width: 88px; height: 88px; border-radius: 50%;
    border: 3px solid #fff;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
  }
  .play span {
    width: 0; height: 0;
    border-left: 28px solid #fff;
    border-top: 16px solid transparent;
    border-bottom: 16px solid transparent;
    margin-left: 6px;
  }
  .k { font-size: 15px; letter-spacing: 0.18em; color: #9bb8cc; margin-bottom: 10px; }
  .t { font-size: 32px; font-weight: 700; letter-spacing: 0.02em; }
  .s { margin-top: 12px; font-size: 18px; color: #c9c4bb; }
</style>
</head>
<body>
  <div class="card">
    <div class="play"><span></span></div>
    <div class="k">VIDEO · 切片 02</div>
    <div class="t">AI 怎么提高准确率？</div>
    <div class="s">请在公众号编辑器将本图替换为视频切片</div>
  </div>
</body>
</html>
