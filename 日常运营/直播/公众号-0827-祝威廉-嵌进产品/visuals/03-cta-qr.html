<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 520px;
    margin: 0;
    background: #fff;
    overflow: hidden;
  }
  body {
    padding: 56px;
    font-family: Georgia, "Source Han Serif SC", "PingFang SC", serif;
    color: #111;
  }
  .box {
    width: fit-content;
    margin: 0 auto;
    border-top: 2px solid #111;
    border-bottom: 1px solid #111;
    padding: 24px 28px 20px;
  }
  .wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 36px;
  }
  .col { text-align: center; width: 220px; }
  .col img, .prize {
    width: 196px; height: 196px;
    object-fit: contain;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
  }
  .col img { display: block; }
  .prize {
    background: #f5c84c;
    color: #111;
    font-size: 36px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: 0.04em;
  }
  .cap {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .sub { margin-top: 4px; font-size: 14px; color: #666; }
  .gift {
    margin-top: 18px;
    text-align: center;
    font-size: 17px;
    color: #326891;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="wrap">
      <div class="col">
        <img src="../images/qr-reserve.png" alt="预约直播">
        <div class="cap">预约直播</div>
        <div class="sub">微信扫码 · 开播提醒</div>
      </div>
      <div class="col">
        <div class="prize">直播间<br>抽会员</div>
        <div class="cap">到播参与</div>
        <div class="sub">月度会员 · 价值 ¥150</div>
      </div>
    </div>
  </div>
  <div class="gift">预约进直播间，现场抽 InfiniSynapse 月度会员</div>
</body>
</html>
