<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111318;
    --teal: #0f958f;
    --teal-deep: #0b7a75;
    --line: rgba(15, 149, 143, 0.36);
  }
  html, body {
    width: 1080px;
    height: 1440px;
    background: #f4f6f8;
    overflow: hidden;
  }
  .cover {
    position: relative;
    width: 1080px;
    height: 1440px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 58% 42% at 86% 38%, rgba(15,149,143,0.10) 0%, transparent 64%),
      linear-gradient(180deg, #f7f9fb 0%, #eef2f4 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
  }
  .portrait {
    position: absolute;
    right: -6px;
    bottom: 292px;
    height: 820px;
    width: auto;
    z-index: 2;
    pointer-events: none;
    filter: drop-shadow(0 14px 24px rgba(17,19,24,0.14));
  }
  .copy {
    position: relative;
    z-index: 3;
    padding: 40px 40px 0 48px;
    width: 620px;
  }
  .logo { height: 38px; width: auto; display: block; }
  .live {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 16px 0 8px;
    border-radius: 999px;
    background: var(--teal);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
  }
  .live .play {
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  h1 {
    margin-top: 24px;
    font-size: 52px;
    font-weight: 800;
    line-height: 1.14;
    letter-spacing: 0.4px;
  }
  h1 .line { display: block; }
  h1 .teal { color: var(--teal); }
  .who {
    margin-top: 14px;
    font-size: 24px;
    font-weight: 600;
    color: #2a3138;
  }
  .when {
    margin-top: 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .when .t {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.25;
  }
  .points {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 460px;
  }
  .point {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border: 1.6px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
  }
  .ico {
    width: 46px; height: 46px; flex: 0 0 46px;
    border-radius: 50%;
    background: var(--teal);
    display: flex; align-items: center; justify-content: center;
  }
  .point h3 {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.25;
  }

  .bottom {
    position: absolute;
    left: 40px; right: 40px; bottom: 28px;
    z-index: 5;
  }
  .qrs {
    display: flex;
    justify-content: center;
    gap: 120px;
    padding: 0 40px 10px;
  }
  .qr { text-align: center; }
  .qr img {
    width: 148px; height: 148px;
    display: block;
    margin: 0 auto 8px;
    border-radius: 16px;
    border: 2px solid var(--teal);
    background: #fff;
    object-fit: cover;
  }
  .qr.group img {
    padding: 8px;
    object-fit: contain;
  }
  .qr .cap {
    font-size: 22px;
    font-weight: 800;
  }
  .foot {
    margin-top: 10px;
    height: 62px;
    border-radius: 16px;
    background: #fff;
    border: 1.6px solid var(--line);
    color: var(--teal-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 800;
  }
  .foot svg { flex: 0 0 auto; }
</style>
</head>
<body>
<div class="cover">
  <img class="portrait" src="will-portrait-cut.png" alt="祝威廉">
  <div class="copy">
    <img class="logo" src="logo.png" alt="InfiniSynapse">
    <div class="live">
      <span class="play">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1.8 8.2 5 3 8.2V1.8Z" fill="#0f958f"/></svg>
      </span>
      微信视频号直播
    </div>
    <h1>
      <span class="line">如何把</span>
      <span class="line teal">InfiniSynapse</span>
      <span class="line">嵌进你的产品</span>
    </h1>
    <div class="who">祝威廉 ｜ InfiniSynapse 联创</div>
    <div class="when">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <rect x="4" y="7" width="26" height="23" rx="4" stroke="#0f958f" stroke-width="2.2"/>
        <path d="M4 14h26" stroke="#0f958f" stroke-width="2.2"/>
        <path d="M11 4.5v5M23 4.5v5" stroke="#0f958f" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="22.5" cy="22.5" r="5.2" stroke="#0f958f" stroke-width="1.8"/>
        <path d="M22.5 20.2v2.6l1.8 1.2" stroke="#0f958f" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div class="t">8/27 周四<br>20:00–21:00</div>
    </div>
    <div class="points">
      <div class="point">
        <div class="ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
            <ellipse cx="12" cy="7" rx="7" ry="3"/>
            <path d="M5 7v6c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/>
            <path d="M5 13v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/>
          </svg>
        </div>
        <h3>嵌在哪一步</h3>
      </div>
      <div class="point">
        <div class="ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
          </svg>
        </div>
        <h3>Key 只放服务端</h3>
      </div>
      <div class="point">
        <div class="ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
            <path d="M4 19V5M4 19h16"/>
            <rect x="7" y="11" width="3.2" height="8" rx="0.6" fill="#fff" stroke="none"/>
            <rect x="12" y="8" width="3.2" height="11" rx="0.6" fill="#fff" stroke="none"/>
          </svg>
        </div>
        <h3>怎样才算嵌完</h3>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="qrs">
      <div class="qr">
        <img src="qr-reserve.png" alt="预约直播">
        <div class="cap">预约直播</div>
      </div>
      <div class="qr group">
        <img src="qr-group.png" alt="进群">
        <div class="cap">进群</div>
      </div>
    </div>
    <div class="foot">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="11" width="17" height="9.5" rx="1.6" stroke="#0b7a75" stroke-width="1.8"/>
        <path d="M3.5 15.5h17M12 11v9.5" stroke="#0b7a75" stroke-width="1.8"/>
        <path d="M12 11c-2.4-3.8-6.2-3.2-6.2-1.2C5.8 12 8.6 12.4 12 11Z" stroke="#0b7a75" stroke-width="1.6"/>
        <path d="M12 11c2.4-3.8 6.2-3.2 6.2-1.2C18.2 12 15.4 12.4 12 11Z" stroke="#0b7a75" stroke-width="1.6"/>
      </svg>
      直播间抽 InfiniSynapse 月度会员 · 价值 ¥150
    </div>
  </div>
</div>
</body>
</html>
