<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111318;
    --muted: #3a4248;
    --teal: #0f958f;
    --teal-deep: #0b7a75;
    --gold: #f5c84c;
    --navy: #16324f;
  }
  html, body {
    width: 1080px;
    height: 1920px;
    background: #fff;
    overflow: hidden;
  }
  .poster {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: #f3f6f8;
  }

  .top {
    position: relative;
    z-index: 6;
    padding: 48px 52px 0;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar img { height: 42px; width: auto; display: block; }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 16px 0 12px;
    border-radius: 999px;
    background: var(--teal);
    color: #fff;
    font-size: 20px;
    font-weight: 800;
  }
  .live i {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff4d4d;
    box-shadow: 0 0 0 4px rgba(255,77,77,0.22);
  }

  h1 {
    margin-top: 36px;
    font-size: 64px;
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: 0.4px;
  }
  h1 em {
    font-style: normal;
    color: var(--teal);
  }

  .when {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .gold {
    background: var(--gold);
    color: #111;
    font-size: 28px;
    font-weight: 800;
    padding: 8px 16px 9px;
    transform: rotate(-3deg);
    box-shadow: 3px 4px 0 rgba(17,19,24,0.12);
  }
  .when .meta {
    font-size: 24px;
    font-weight: 700;
    color: var(--muted);
  }

  .duo {
    margin-top: 28px;
    display: grid;
    grid-template-columns: 1fr 44px 1fr;
    align-items: stretch;
    gap: 0;
  }
  .card {
    background: #fff;
    border: 1.5px solid rgba(15,149,143,0.28);
    border-radius: 20px;
    padding: 22px 22px 20px;
  }
  .card.accent {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }
  .kicker {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: var(--teal-deep);
  }
  .card.accent .kicker { color: rgba(255,255,255,0.82); }
  .card .h {
    margin-top: 8px;
    font-size: 34px;
    font-weight: 800;
    line-height: 1.15;
  }
  .card .d {
    margin-top: 8px;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--muted);
  }
  .card.accent .d { color: rgba(255,255,255,0.9); }
  .plus {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 800;
    color: var(--teal);
  }

  .stage {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 1180px;
    z-index: 3;
  }
  .who {
    position: absolute;
    left: 52px;
    top: 36px;
    z-index: 5;
  }
  .who .role {
    font-size: 22px;
    font-weight: 700;
    color: #2a3138;
  }
  .who .name {
    margin-top: 4px;
    font-size: 56px;
    font-weight: 800;
    line-height: 1;
    border-bottom: 6px solid #111;
    display: inline-block;
    padding-bottom: 4px;
  }
  .portrait {
    position: absolute;
    left: 50%;
    bottom: 248px;
    transform: translateX(-46%);
    width: 720px;
    height: auto;
    z-index: 4;
    filter: drop-shadow(0 18px 28px rgba(17,19,24,0.18));
  }

  .waves {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 430px;
    z-index: 2;
  }
  .waves svg { display: block; width: 100%; height: 100%; }

  .cta {
    position: absolute;
    left: 36px; right: 36px; bottom: 28px;
    z-index: 6;
    display: grid;
    grid-template-columns: 156px 1fr 220px;
    gap: 14px;
    align-items: center;
    background: #fff;
    border-radius: 22px;
    padding: 16px 16px 14px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.18);
  }
  .qr { text-align: center; }
  .qr img {
    width: 132px; height: 132px;
    display: block; margin: 0 auto 6px;
    border-radius: 16px;
    object-fit: cover;
  }
  .qr .cap { font-size: 18px; font-weight: 800; }
  .cta-copy { text-align: center; }
  .cta-copy .scan {
    font-size: 32px;
    font-weight: 800;
    color: var(--teal);
    line-height: 1.15;
  }
  .cta-copy .line {
    margin-top: 6px;
    font-size: 22px;
    font-weight: 700;
  }
  .prize {
    height: 148px;
    border-radius: 18px;
    background: var(--gold);
    color: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px 12px;
  }
  .prize .k { font-size: 16px; font-weight: 800; letter-spacing: 1px; opacity: 0.72; }
  .prize .h { margin-top: 4px; font-size: 30px; font-weight: 800; line-height: 1.15; }
  .prize .d { margin-top: 6px; font-size: 18px; font-weight: 700; }
</style>
</head>
<body>
<div class="poster">
  <div class="top">
    <div class="topbar">
      <img src="logo.png" alt="InfiniSynapse">
      <div class="live"><i></i>视频号直播</div>
    </div>
    <h1>如何把 <em>InfiniSynapse</em><br>嵌进你的产品</h1>
    <div class="when">
      <div class="gold">8.27 晚八点</div>
      <div class="meta">周四 · 微信视频号</div>
    </div>
    <div class="duo">
      <div class="card">
        <div class="kicker">PART 01</div>
        <div class="h">创始人讲解</div>
        <div class="d">嵌在哪一步 · Key 只放服务端</div>
      </div>
      <div class="plus">+</div>
      <div class="card accent">
        <div class="kicker">PART 02</div>
        <div class="h">10年全栈实操</div>
        <div class="d">当场接到你的产品里</div>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="who">
      <div class="role">InfiniSynapse 联创</div>
      <div class="name">祝威廉</div>
    </div>
    <img class="portrait" src="will-portrait-bust.png" alt="祝威廉">
    <div class="waves">
      <svg viewBox="0 0 1080 430" preserveAspectRatio="none">
        <path d="M0 86 C 180 36, 360 140, 540 86 C 720 32, 900 132, 1080 72 L 1080 430 L 0 430 Z" fill="#12a39c"/>
        <path d="M0 128 C 200 78, 390 176, 580 128 C 770 80, 920 172, 1080 118 L 1080 430 L 0 430 Z" fill="#0f958f"/>
        <path d="M0 176 C 220 132, 430 228, 660 176 C 850 136, 970 216, 1080 168 L 1080 430 L 0 430 Z" fill="#1b4f6e"/>
        <path d="M0 228 C 240 188, 470 268, 720 228 C 900 200, 1000 264, 1080 224 L 1080 430 L 0 430 Z" fill="#121820"/>
        <path d="M0 98 C 180 48, 360 152, 540 98 C 720 44, 900 144, 1080 84" fill="none" stroke="#f5c84c" stroke-width="3"/>
      </svg>
    </div>
    <div class="cta">
      <div class="qr">
        <img src="qr-reserve.png" alt="预约直播">
        <div class="cap">预约直播</div>
      </div>
      <div class="cta-copy">
        <div class="scan">微信扫码预约</div>
        <div class="line">8月27日 周四 20:00</div>
      </div>
      <div class="prize">
        <div class="k">到播参与</div>
        <div class="h">直播间抽会员</div>
        <div class="d">月度会员 · ¥150</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
