<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111820;
    --teal: #07958f;
    --teal-light: #15b8ad;
    --navy: #06253a;
    --gold: #f7c950;
  }
  html, body {
    width: 1080px;
    height: 1620px;
    overflow: hidden;
    background: #f5f7f8;
  }
  .cover {
    position: relative;
    width: 1080px;
    height: 1620px;
    overflow: hidden;
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", Arial, sans-serif;
    background:
      radial-gradient(circle at 89% 33%, rgba(255,255,255,.95), transparent 29%),
      linear-gradient(180deg, #f8fafb 0%, #f1f5f6 73%, #eaf0f2 100%);
  }
  .cover::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .35;
    background:
      radial-gradient(circle, rgba(15,149,143,.28) 1.4px, transparent 1.6px) 885px 355px / 14px 14px no-repeat,
      linear-gradient(135deg, transparent 0 84%, rgba(15,149,143,.08) 84.2% 84.5%, transparent 84.7%);
  }
  .logo {
    position: absolute;
    left: 44px;
    top: 34px;
    width: 275px;
    height: auto;
    z-index: 8;
  }
  .title {
    position: absolute;
    left: 76px;
    right: 58px;
    top: 138px;
    z-index: 8;
  }
  .question {
    font-size: 64px;
    line-height: 1.16;
    font-weight: 900;
    letter-spacing: -.4px;
  }
  .headline {
    margin-top: 18px;
    color: var(--teal);
    font-size: 100px;
    line-height: .98;
    font-weight: 950;
    letter-spacing: 3px;
    white-space: nowrap;
    text-shadow: 0 5px 0 rgba(6,85,82,.08);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    margin-top: 25px;
    min-height: 64px;
    padding: 0 22px;
    background: linear-gradient(180deg, #ffe28b, var(--gold));
    border-radius: 5px;
    color: #332500;
    font-size: 31px;
    font-weight: 950;
    transform: rotate(-4deg);
    box-shadow: 4px 6px 0 rgba(17,24,32,.12);
  }
  .sub {
    position: absolute;
    left: 76px;
    top: 520px;
    z-index: 8;
    display: inline-flex;
    height: 48px;
    align-items: center;
    padding: 0 18px;
    background: var(--ink);
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .5px;
  }
  .stage {
    position: absolute;
    left: 0;
    right: 0;
    top: 420px;
    height: 980px;
    z-index: 4;
  }
  .icon {
    position: absolute;
    z-index: 1;
    opacity: .10;
  }
  .icon.database { left: 72px; top: 175px; }
  .icon.chart { right: 78px; top: 42px; }
  .icon.nodes { right: 150px; top: 195px; }
  .portrait {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    width: 650px;
    height: auto;
    z-index: 3;
    filter: drop-shadow(0 16px 23px rgba(17,24,32,.15));
  }
  .who {
    position: absolute;
    right: 58px;
    top: 340px;
    z-index: 5;
    width: 245px;
  }
  .who .mark {
    width: 62px;
    height: 54px;
    overflow: hidden;
  }
  .who .mark img {
    width: 238px;
    height: auto;
    display: block;
  }
  .who .role {
    margin-top: 14px;
    font-size: 21px;
    font-weight: 650;
  }
  .who .name {
    margin-top: 8px;
    padding-bottom: 8px;
    border-bottom: 3px solid var(--ink);
    font-size: 44px;
    line-height: 1;
    font-weight: 900;
  }
  .who .time {
    margin-top: 14px;
    color: var(--teal);
    font-size: 22px;
    font-weight: 850;
  }
  .waves {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 650px;
    z-index: 5;
  }
  .waves svg { display: block; width: 100%; height: 100%; }
  .bottom-logo {
    position: absolute;
    left: 50%;
    bottom: 86px;
    transform: translateX(-50%);
    width: 510px;
    height: auto;
    z-index: 7;
    filter: brightness(0) invert(1);
  }
</style>
</head>
<body>
<main class="cover">
  <img class="logo" src="logo.png" alt="InfiniSynapse">

  <section class="title">
    <div class="question">如何把 InfiniSynapse<br>嵌进你的产品？</div>
    <div class="headline">现场接入实操</div>
    <div class="badge">8.27 晚八点</div>
  </section>
  <div class="sub">创始人讲解 + 10年全栈程序员实操</div>

  <section class="stage">
    <svg class="icon database" width="90" height="90" viewBox="0 0 40 40" fill="none" stroke="#16324f" stroke-width="1.6">
      <ellipse cx="20" cy="11" rx="12" ry="5"/>
      <path d="M8 11v10c0 3 5 5 12 5s12-2 12-5V11M8 21v7c0 3 5 5 12 5s12-2 12-5v-7"/>
    </svg>
    <svg class="icon chart" width="84" height="84" viewBox="0 0 40 40" fill="none" stroke="#16324f" stroke-width="2">
      <rect x="4" y="4" width="32" height="32" rx="4"/>
      <path d="M10 30V20M18 30V13M26 30V8M34 30H8"/>
    </svg>
    <svg class="icon nodes" width="105" height="105" viewBox="0 0 40 40" fill="none" stroke="#16324f" stroke-width="1.5">
      <circle cx="20" cy="20" r="5"/><circle cx="7" cy="9" r="3"/><circle cx="33" cy="8" r="3"/><circle cx="34" cy="31" r="3"/>
      <path d="M16 16 9 11M24 16l7-6M24 24l8 5"/>
    </svg>

    <div class="who">
      <div class="mark"><img src="logo.png" alt=""></div>
      <div class="role">InfiniSynapse 联创</div>
      <div class="name">祝威廉</div>
      <div class="time">周四 20:00–21:00</div>
    </div>
    <img class="portrait" src="will-portrait-bust.png" alt="祝威廉">
  </section>

  <div class="waves">
    <svg viewBox="0 0 1080 650" preserveAspectRatio="none">
      <path d="M0 110 C 210 310, 320 350, 520 430 C 730 515, 870 410, 1080 120 L1080 650H0Z" fill="#11b1a7"/>
      <path d="M0 180 C 210 330, 365 400, 555 470 C 760 545, 900 430, 1080 170 L1080 650H0Z" fill="#078f8c"/>
      <path d="M0 255 C 220 360, 390 445, 610 505 C 810 560, 930 455, 1080 245 L1080 650H0Z" fill="#07536b"/>
      <path d="M0 330 C 250 390, 440 485, 660 535 C 850 575, 970 490, 1080 350 L1080 650H0Z" fill="#052b43"/>
      <path d="M0 374 C 245 420, 440 500, 665 548 C 860 588, 970 515, 1080 390 L1080 650H0Z" fill="#061d31"/>
      <path d="M0 268 C 215 370, 390 450, 610 511 C 810 566, 930 462, 1080 252" fill="none" stroke="#f7c950" stroke-width="8"/>
      <g fill="none" stroke="rgba(255,255,255,.34)" stroke-width="1.6">
        <path d="M0 145 C 210 330, 330 370, 540 445 C 750 520, 885 420, 1080 145"/>
        <path d="M0 205 C 220 350, 380 420, 575 485 C 780 550, 910 440, 1080 195"/>
        <path d="M0 305 C 235 390, 410 465, 630 522 C 825 570, 950 475, 1080 295"/>
      </g>
    </svg>
  </div>
  <img class="bottom-logo" src="logo.png" alt="InfiniSynapse">
</main>
</body>
</html>
