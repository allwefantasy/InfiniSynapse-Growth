<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #12151d;
    --muted: #3a4248;
    --teal: #0f958f;
    --teal-deep: #0b7a75;
    --gold: #e8b43a;
    --line: rgba(15, 149, 143, 0.28);
  }
  html, body {
    width: 1080px;
    height: 1440px;
    background: #fff;
    overflow: hidden;
  }
  .poster {
    position: relative;
    width: 1080px;
    height: 1440px;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse 70% 48% at 82% 22%, rgba(15,149,143,0.12) 0%, transparent 62%),
      linear-gradient(180deg, #f7fafb 0%, #eef4f4 58%, #dcecea 100%);
  }

  .inner {
    height: 100%;
    padding: 40px 44px 32px;
    display: flex;
    flex-direction: column;
  }

  .hero {
    display: grid;
    grid-template-columns: 1fr 428px;
    gap: 12px;
    align-items: stretch;
    min-height: 0;
    flex: 1 1 auto;
  }

  .copy { position: relative; z-index: 3; min-width: 0; }
  .logo { height: 40px; width: auto; display: block; }
  .live {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 16px 0 8px;
    border-radius: 999px;
    background: var(--teal);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
  }
  .live .play {
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  h1 {
    margin-top: 28px;
    font-size: 54px;
    font-weight: 800;
    line-height: 1.16;
    letter-spacing: 0.3px;
  }
  h1 .line { display: block; }
  h1 .teal { color: var(--teal); }
  .who {
    margin-top: 16px;
    font-size: 24px;
    font-weight: 600;
    color: #2a3138;
  }
  .when {
    margin-top: 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    color: var(--teal-deep);
  }
  .when .t {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.25;
  }

  .photo {
    position: relative;
    z-index: 1;
    height: 100%;
    min-height: 620px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding-bottom: 8px;
  }
  .photo img {
    height: auto;
    width: 100%;
    max-height: 100%;
    object-fit: contain;
    object-position: right bottom;
    display: block;
    filter: drop-shadow(0 12px 20px rgba(18,21,29,0.14));
  }

  .banner {
    position: relative;
    z-index: 4;
    margin-top: 14px;
    flex: 0 0 auto;
    min-height: 148px;
    border-radius: 18px;
    padding: 28px 28px 24px;
    background:
      linear-gradient(105deg, rgba(255,255,255,0.14) 0%, transparent 28%, transparent 72%, rgba(255,255,255,0.10) 100%),
      linear-gradient(90deg, #12a39c 0%, #0f958f 48%, #0b7a75 100%);
    color: #fff;
    box-shadow: 0 10px 22px rgba(11,122,117,0.22);
  }
  .ribbon {
    position: absolute;
    left: 22px;
    top: -14px;
    height: 32px;
    padding: 0 14px;
    border-radius: 6px;
    background: linear-gradient(180deg, #f6d36a 0%, #e0b033 100%);
    color: #6a4a08;
    font-size: 18px;
    font-weight: 800;
    display: flex;
    align-items: center;
    box-shadow: 0 3px 0 rgba(160,110,16,0.28);
  }
  .banner .h {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 0.4px;
  }
  .banner .d {
    margin-top: 8px;
    font-size: 22px;
    font-weight: 600;
    opacity: 0.94;
  }

  .cards {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    flex: 0 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 20px 16px 18px;
    text-align: center;
    box-shadow: 0 8px 18px rgba(18,21,29,0.06);
  }
  .ico {
    width: 52px; height: 52px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: var(--teal);
    display: flex; align-items: center; justify-content: center;
  }
  .card p {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.3;
    color: var(--teal-deep);
  }

  .foot {
    margin-top: 16px;
    flex: 0 0 auto;
    height: 72px;
    border-radius: 16px;
    background: var(--teal);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="inner">
    <div class="hero">
      <div class="copy">
        <img class="logo" src="logo.png" alt="InfiniSynapse">
        <div class="live">
          <span class="play">
            <svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1.8 8.2 5 3 8.2V1.8Z" fill="#0f958f"/></svg>
          </span>
          微信视频号直播
        </div>
        <h1>
          <span class="line">如何把</span>
          <span class="line teal">InfiniSynapse</span>
          <span class="line">嵌进你的产品</span>
        </h1>
        <div class="who">祝威廉 ｜ InfiniSynapse 联创</div>
        <div class="when">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
            <rect x="4" y="7" width="26" height="23" rx="4" stroke="#0b7a75" stroke-width="2.2"/>
            <path d="M4 14h26" stroke="#0b7a75" stroke-width="2.2"/>
            <path d="M11 4.5v5M23 4.5v5" stroke="#0b7a75" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="22.5" cy="22.5" r="5.2" stroke="#0b7a75" stroke-width="1.8"/>
            <path d="M22.5 20.2v2.6l1.8 1.2" stroke="#0b7a75" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <div class="t">8/27 周四<br>20:00–21:00</div>
        </div>
      </div>
      <div class="photo">
        <img src="will-portrait-cut.png" alt="祝威廉">
      </div>
    </div>

    <div class="banner">
      <div class="ribbon">讲解 + 实操</div>
      <div class="h">创始人讲解 + 10年全栈实操</div>
      <div class="d">当场接到你的产品里</div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="ico">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
            <ellipse cx="12" cy="7" rx="7" ry="3"/>
            <path d="M5 7v6c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/>
            <path d="M5 13v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/>
          </svg>
        </div>
        <p>嵌在哪一步<br>不用重写平台</p>
      </div>
      <div class="card">
        <div class="ico">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
          </svg>
        </div>
        <p>Key 只放服务端<br>前端碰不到密钥</p>
      </div>
      <div class="card">
        <div class="ico">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
            <path d="M4 19V5M4 19h16"/>
            <rect x="7" y="11" width="3.2" height="8" rx="0.6" fill="#fff" stroke="none"/>
            <rect x="12" y="8" width="3.2" height="11" rx="0.6" fill="#fff" stroke="none"/>
          </svg>
        </div>
        <p>怎样才算嵌完<br>进度可见可回写</p>
      </div>
    </div>

    <div class="foot">wx搜索「祝威廉」预约直播，直播间抽价值150元会员</div>
  </div>
</div>
</body>
</html>
