<!DOCTYPE html><html><head><meta charset=utf-8><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1440px;overflow:hidden;font-family:"Noto Sans SC","PingFang SC",sans-serif}
.card{width:1080px;height:1440px;position:relative}
.pad{padding:72px 64px;height:100%;display:flex;flex-direction:column}
.eyebrow{font-size:28px;letter-spacing:.08em;font-weight:700;opacity:.7;margin-bottom:28px}
h1{font-size:64px;line-height:1.15;font-weight:900;letter-spacing:-.02em;margin-bottom:48px}
.brand{margin-top:auto;font-size:30px;font-weight:700;opacity:.85}
.step{display:flex;gap:28px;align-items:flex-start;margin-bottom:44px}
.num{width:72px;height:72px;border-radius:18px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;flex-shrink:0}
.step h3{font-size:40px;font-weight:800;margin-bottom:10px}
.step p{font-size:30px;line-height:1.45;opacity:.75}
.row{border-radius:28px;padding:32px 36px;margin-bottom:24px}
.tag{display:inline-block;font-size:24px;font-weight:800;padding:8px 16px;border-radius:999px;margin-bottom:14px}
.p0{background:#ffe2e0;color:#b42318}.p1{background:#fff1d6;color:#b54708}
.row h3{font-size:36px;font-weight:800;margin-bottom:10px}
.metrics{font-size:28px;line-height:1.55;opacity:.88}
.delta{font-weight:800;color:#e11d48}
.action-title{font-size:34px;font-weight:800;margin-bottom:8px}
.action-body{font-size:26px;line-height:1.5;opacity:.8}
.cta-box{margin-top:auto;padding:36px 40px;border-radius:28px;background:#111827;color:#fff}
.cta-box .t{font-size:32px;font-weight:800;margin-bottom:10px}
.cta-box .d{font-size:24px;opacity:.75;line-height:1.45}
.light{background:linear-gradient(165deg,#f7f4ef 0%,#eef3f8 55%,#e8eef6 100%);color:#12151c}
.dark{background:#0b1220;color:#f5f7fb}
.dark .row{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.light .row{background:rgba(255,255,255,.72);border:1px solid rgba(18,21,28,.08)}
</style></head><body>
<section class="card dark"><div class="pad">
<div class="eyebrow">RESULT · TOP 3 异常</div>
<h1>本周最该盯的<br/>三件事</h1>
<div class="row"><span class="tag p0">P0 · #1</span><h3>搜索广告 · 退货率飙升</h3><div class="metrics">本周 <strong>21.50%</strong> vs 历史均值 <strong>4.02%</strong><br/><span class="delta">变化 +435.5%（+17.48pp）</span></div></div>
<div class="row"><span class="tag p0">P0 · #2</span><h3>直播 · GMV 断崖</h3><div class="metrics">本周 <strong>¥19.8万</strong> vs 历史均值 <strong>¥61.2万</strong><br/><span class="delta">变化 −67.6%</span></div></div>
<div class="row"><span class="tag p1">P1 · #3</span><h3>信息流 · 加投但 ROI 变差</h3><div class="metrics">ROI 本周 <strong>2.22</strong> vs 历史 <strong>5.05</strong><br/><span class="delta">变化 −56.1% · 花费 +86.7%</span></div></div>
<div class="brand">真实任务跑数 · InfiniSynapse × GPT 5.6 Sol</div>
</div></section></body></html>
