<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { width: 1080px; margin: 0; padding: 48px 56px 56px; font-family: -apple-system, "PingFang SC", sans-serif; background: #fff; }
  </style>
</head>
<body>
  <div class="text-center mb-12">
    <div class="text-sm uppercase tracking-[0.2em] text-slate-400 mb-2">Timeline</div>
    <div class="text-4xl font-bold text-slate-900">报名时间线</div>
    <div class="text-base text-slate-500 mt-3">InfiniSynapse × CSDN · Vibe Coding 应用开发大赛</div>
  </div>

  <div class="flex justify-between text-sm font-semibold text-slate-400 mb-3 px-8">
    <span>7 月</span>
    <span class="text-slate-300">｜</span>
    <span>8 月</span>
  </div>

  <div class="relative mx-4 mb-16">
    <div class="h-3 bg-slate-100 rounded-full overflow-hidden flex">
      <div class="h-full bg-blue-500" style="width: 62%"></div>
      <div class="h-full bg-amber-400" style="width: 10%"></div>
      <div class="h-full bg-violet-400" style="width: 18%"></div>
      <div class="h-full bg-emerald-500" style="width: 10%"></div>
    </div>

    <div class="absolute top-0" style="left: 3%; transform: translateX(-50%)">
      <div class="w-5 h-5 rounded-full bg-slate-700 border-4 border-white shadow -mt-1 mx-auto"></div>
    </div>
    <div class="absolute top-0" style="left: 64%; transform: translateX(-50%)">
      <div class="w-5 h-5 rounded-full bg-amber-500 border-4 border-white shadow -mt-1 mx-auto"></div>
    </div>
    <div class="absolute top-0" style="left: 74%; transform: translateX(-50%)">
      <div class="w-7 h-7 rounded-full bg-red-500 border-4 border-white shadow-lg -mt-1.5 mx-auto ring-4 ring-red-100"></div>
    </div>
    <div class="absolute top-0" style="left: 96%; transform: translateX(-50%)">
      <div class="w-5 h-5 rounded-full bg-emerald-500 border-4 border-white shadow -mt-1 mx-auto"></div>
    </div>
  </div>

  <div class="grid grid-cols-4 gap-4">
    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-5">
      <div class="text-xs font-bold text-slate-500 mb-1">即日起</div>
      <div class="font-bold text-slate-900 text-xl mb-2">报名开放</div>
      <div class="text-sm text-slate-600 leading-relaxed">注册 InfiniSynapse<br>创建 API Key<br><strong>送 500 积分</strong></div>
    </div>
    <div class="rounded-2xl border border-blue-200 bg-blue-50 p-5">
      <div class="text-xs font-bold text-blue-600 mb-1">即日起 — 7/28</div>
      <div class="font-bold text-slate-900 text-xl mb-2">作品开发</div>
      <div class="text-sm text-slate-600 leading-relaxed">接入 API<br>部署上线<br>微信群答疑</div>
    </div>
    <div class="rounded-2xl border-2 border-amber-300 bg-amber-50 p-5">
      <div class="text-xs font-bold text-amber-700 mb-1">7/29 — 7/31</div>
      <div class="font-bold text-slate-900 text-xl mb-2">冲刺提交</div>
      <div class="text-sm text-slate-600 leading-relaxed">最终提醒<br>CSDN 专区交稿</div>
      <div class="mt-3 text-sm font-bold text-red-600 bg-red-50 rounded-lg px-2 py-1.5 text-center">截止 7/31 23:59</div>
    </div>
    <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-5">
      <div class="text-xs font-bold text-emerald-700 mb-1">8/1 — 8/11</div>
      <div class="font-bold text-slate-900 text-xl mb-2">评审公示</div>
      <div class="text-sm text-slate-600 leading-relaxed">准入审核<br>专家打分<br><strong>8/11 获奖公布</strong></div>
    </div>
  </div>

  <div class="flex flex-wrap justify-center gap-6 mt-10 text-xs text-slate-500">
    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-700"></span>报名注册</div>
    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-500"></span>开发期</div>
    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-400"></span>冲刺期</div>
    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-500"></span>提交截止</div>
    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500"></span>获奖公示</div>
  </div>
</body>
</html>
