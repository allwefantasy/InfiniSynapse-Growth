<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { width: 1080px; margin: 0; padding: 48px; font-family: -apple-system, "PingFang SC", sans-serif; background: #fff; }
  </style>
</head>
<body>
  <div class="text-center mb-8">
    <div class="text-sm uppercase tracking-widest text-slate-500 mb-2">奖励设置</div>
    <div class="text-3xl font-bold text-slate-900">2 的幂次方奖金 + Pro 会员权益</div>
    <div class="text-sm text-slate-500 mt-2">现金总额 ¥22,528 · 会员权益 ¥13,800</div>
  </div>

  <div class="rounded-2xl overflow-hidden border border-gray-200 shadow-lg">
    <div class="grid grid-cols-4 bg-slate-800 text-white text-sm font-semibold">
      <div class="p-4">奖项</div>
      <div class="p-4 text-center">名额</div>
      <div class="p-4 text-center">现金（RMB）</div>
      <div class="p-4 text-center">附加权益</div>
    </div>
    <div class="grid grid-cols-4 text-sm border-b border-gray-100 bg-amber-50">
      <div class="p-4 font-bold text-amber-900">🥇 一等奖</div>
      <div class="p-4 text-center">2 人</div>
      <div class="p-4 text-center font-bold text-lg">4,096</div>
      <div class="p-4 text-center text-slate-700">年度 Pro 会员（价值 ¥1,800）</div>
    </div>
    <div class="grid grid-cols-4 text-sm border-b border-gray-100">
      <div class="p-4 font-bold text-slate-700">🥈 二等奖</div>
      <div class="p-4 text-center">4 人</div>
      <div class="p-4 text-center font-bold text-lg">2,048</div>
      <div class="p-4 text-center text-slate-600">三个月 Pro 会员（价值 ¥450）</div>
    </div>
    <div class="grid grid-cols-4 text-sm border-b border-gray-100">
      <div class="p-4 font-bold text-slate-700">🥉 三等奖</div>
      <div class="p-4 text-center">6 人</div>
      <div class="p-4 text-center font-bold text-lg">1,024</div>
      <div class="p-4 text-center text-slate-600">月度 Pro 会员（价值 ¥150）</div>
    </div>
    <div class="grid grid-cols-4 text-sm bg-emerald-50">
      <div class="p-4 font-bold text-emerald-900">🎁 优秀奖</div>
      <div class="p-4 text-center">50 人</div>
      <div class="p-4 text-center text-slate-400">—</div>
      <div class="p-4 text-center text-slate-700">月度 Pro 会员（价值 ¥150）</div>
    </div>
  </div>

  <div class="mt-6 p-6 bg-gradient-to-r from-blue-50 to-violet-50 border border-blue-200 rounded-2xl flex items-center gap-5">
    <div class="text-5xl font-bold text-blue-600 shrink-0">500</div>
    <div>
      <div class="font-bold text-slate-900 text-xl">注册即送 500 积分</div>
      <div class="text-sm text-slate-600 mt-2 leading-relaxed">注册并创建 API Key 即时到账，无需邀请码。积分可兑换 Token，直接用来调 API、跑分析。</div>
    </div>
  </div>
</body>
</html>
