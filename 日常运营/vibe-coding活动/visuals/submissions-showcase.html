<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 1080px; margin: 0; padding: 48px 56px 56px; font-family: -apple-system, "PingFang SC", sans-serif; background: #fff; }
  .shot { width: 100%; border-radius: 12px; border: 1px solid #e2e8f0; display: block; }
</style>
</head>
<body>
  <div class="text-center mb-10">
    <div class="text-sm uppercase tracking-[0.2em] text-slate-400 mb-2">Submissions</div>
    <div class="text-4xl font-bold text-slate-900">部分已上线作品一览</div>
    <div class="text-base text-slate-500 mt-3">以下为部分公开展示的代表作 · 均已部署上线</div>
  </div>

  <div class="space-y-8">
    <div class="rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
      <div class="grid grid-cols-12">
        <div class="col-span-1 bg-blue-600 text-white flex items-center justify-center text-2xl font-black">01</div>
        <div class="col-span-11 p-6">
          <div class="flex items-start justify-between gap-4">
            <div>
              <div class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1">消费决策 · 电商搜索</div>
              <div class="text-2xl font-bold text-slate-900">帮我找到那个东西</div>
              <div class="text-base text-slate-600 mt-2 leading-relaxed">不知道商品名，也能按用途描述找到合适商品，并完成加购决策。</div>
            </div>
            <div class="shrink-0 px-4 py-2 rounded-full bg-emerald-100 text-emerald-700 text-sm font-bold">已上线</div>
          </div>
        </div>
      </div>
      <div class="px-6 pb-6"><img class="shot" src="../images/submission-find-that-thing.png" alt="帮我找到那个东西"></div>
    </div>

    <div class="rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
      <div class="grid grid-cols-12">
        <div class="col-span-1 bg-amber-500 text-white flex items-center justify-center text-2xl font-black">02</div>
        <div class="col-span-11 p-6">
          <div class="flex items-start justify-between gap-4">
            <div>
              <div class="text-xs font-bold text-amber-600 uppercase tracking-wider mb-1">个人理财 · 性格测评</div>
              <div class="text-2xl font-bold text-slate-900">财格</div>
              <div class="text-base text-slate-600 mt-2 leading-relaxed">AI 结合消费数据，输出可读、可分享的理财性格报告。</div>
            </div>
            <div class="shrink-0 px-4 py-2 rounded-full bg-emerald-100 text-emerald-700 text-sm font-bold">已上线</div>
          </div>
        </div>
      </div>
      <div class="px-6 pb-6"><img class="shot" src="../images/submission-caige.png" alt="财格"></div>
    </div>

    <div class="rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
      <div class="grid grid-cols-12">
        <div class="col-span-1 bg-violet-600 text-white flex items-center justify-center text-2xl font-black">03</div>
        <div class="col-span-11 p-6">
          <div class="flex items-start justify-between gap-4">
            <div>
              <div class="text-xs font-bold text-violet-600 uppercase tracking-wider mb-1">项目评估 · 决策支持</div>
              <div class="text-2xl font-bold text-slate-900">ProjectValueLab</div>
              <div class="text-base text-slate-600 mt-2 leading-relaxed">项目价值调研工具——围绕证据、评分、风险与建议输出结构化分析。</div>
            </div>
            <div class="shrink-0 px-4 py-2 rounded-full bg-emerald-100 text-emerald-700 text-sm font-bold">已上线</div>
          </div>
        </div>
      </div>
      <div class="px-6 pb-6"><img class="shot" src="../images/submission-pvl.png" alt="ProjectValueLab"></div>
    </div>
  </div>
</body>
</html>
