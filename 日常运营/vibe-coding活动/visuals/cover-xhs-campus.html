<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050608;
    --blue: #2E6BFF;
    --cyan: #35E0E8;
    --gold: #F2C14E;
    --ink: #ffffff;
  }
  body { background: #fff; }

  .cover {
    position: relative;
    width: 1080px;
    height: 1440px;
    overflow: hidden;
    background:
      radial-gradient(900px 700px at 78% 6%, rgba(46,107,255,0.28), transparent 60%),
      radial-gradient(760px 620px at 12% 96%, rgba(53,224,232,0.14), transparent 60%),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
  }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,150,220,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,150,220,0.055) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(circle at 68% 30%, #000, transparent 82%);
  }
  .tech { position: absolute; inset: 0; }

  .hud { position: absolute; width: 40px; height: 40px; border: 2px solid rgba(120,160,255,0.45); }
  .hud.tl { top: 40px; left: 40px; border-right: none; border-bottom: none; }
  .hud.tr { top: 40px; right: 40px; border-left: none; border-bottom: none; }
  .hud.bl { bottom: 40px; left: 40px; border-right: none; border-top: none; }
  .hud.br { bottom: 40px; right: 40px; border-left: none; border-top: none; }

  .content {
    position: relative; z-index: 3;
    height: 100%;
    padding: 96px 84px 92px;
    display: flex; flex-direction: column;
  }

  .top {
    display: inline-flex; align-items: center; gap: 12px;
    align-self: flex-start;
    padding: 12px 22px; border-radius: 999px;
    border: 1px solid rgba(150,180,255,0.35);
    background: rgba(46,107,255,0.12);
    font-size: 26px; letter-spacing: 1px; color: #cdd9ff;
    box-shadow: 0 0 30px rgba(46,107,255,0.25) inset;
  }
  .top b { color: #fff; font-weight: 700; }
  .top .x { color: #7f93c8; }
  .top .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 14px var(--cyan); }

  .hook {
    margin-top: 78px;
    font-size: 40px; font-weight: 700; line-height: 1.5;
    color: #aeb9d6;
  }
  .hook .strike { color: #6b7590; text-decoration: line-through; text-decoration-color: rgba(242,193,78,0.8); }

  h1 {
    margin-top: 30px;
    font-size: 104px; font-weight: 900; line-height: 1.16; letter-spacing: 1px;
    text-shadow: 0 6px 40px rgba(0,0,0,0.5);
  }
  h1 .gold { color: var(--gold); text-shadow: 0 0 34px rgba(242,193,78,0.5); }
  h1 .hl {
    color: #8fb2ff; text-shadow: 0 0 40px rgba(80,140,255,0.6);
    position: relative;
  }
  h1 .hl::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 6px; height: 16px;
    background: linear-gradient(90deg, rgba(46,107,255,0.45), rgba(53,224,232,0.35));
    z-index: -1; border-radius: 4px;
  }

  .sub {
    margin-top: 44px;
    font-size: 34px; line-height: 1.6; color: #d7def2; font-weight: 500;
  }
  .sub .em { color: #fff; font-weight: 700; }

  .spacer { flex: 1; }

  .tags { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 34px; }
  .tag {
    font-size: 30px; font-weight: 700; padding: 14px 26px; border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.16);
    color: #eef2ff;
  }
  .tag.gold { color: #1b1206; background: var(--gold); border-color: var(--gold); box-shadow: 0 0 26px rgba(242,193,78,0.4); }
  .tag.cyan { color: #04262a; background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 26px rgba(53,224,232,0.35); }

  .foot {
    display: flex; align-items: center; gap: 16px;
    font-size: 30px; color: #9fb0d6; font-weight: 600; letter-spacing: 1px;
  }
  .foot .bar { width: 40px; height: 3px; background: var(--blue); box-shadow: 0 0 10px var(--blue); }
  .foot .mono { font-family: "SF Mono", Menlo, monospace; color: #7ea0dd; font-size: 26px; }

  .cert {
    position: absolute;
    right: 66px; top: 566px;
    width: 372px;
    z-index: 2;
    transform: rotate(4deg);
  }
  .cert img {
    display: block; width: 100%; border-radius: 12px;
    border: 1px solid rgba(150,180,255,0.35);
    box-shadow:
      0 30px 70px rgba(0,0,0,0.6),
      0 0 60px rgba(46,107,255,0.35);
  }
  .cert .badge {
    position: absolute; top: -20px; left: -14px;
    padding: 10px 20px; border-radius: 999px;
    background: var(--gold); color: #1b1206;
    font-size: 26px; font-weight: 800; letter-spacing: 1px;
    box-shadow: 0 0 24px rgba(242,193,78,0.5);
    transform: rotate(-4deg);
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="grid"></div>

    <svg class="tech" viewBox="0 0 1080 1440" preserveAspectRatio="none">
      <defs>
        <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#35E0E8" stop-opacity="0"/>
          <stop offset="0.5" stop-color="#5aa0ff" stop-opacity="0.5"/>
          <stop offset="1" stop-color="#35E0E8" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#9fdcff"/>
          <stop offset="1" stop-color="#2E6BFF" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g stroke="url(#line)" stroke-width="1.6" fill="none">
        <path d="M760 150 L900 150 L960 230 L1040 230"/>
        <path d="M820 300 L940 300 L980 380 L1050 380"/>
        <path d="M900 150 L940 300"/>
        <path d="M150 1180 L280 1180 L330 1120 L470 1120"/>
        <path d="M150 1260 L250 1260 L300 1320 L440 1320"/>
      </g>
      <g fill="#8fd0ff">
        <circle cx="760" cy="150" r="5"/>
        <circle cx="900" cy="150" r="4"/>
        <circle cx="1040" cy="230" r="5"/>
        <circle cx="820" cy="300" r="4"/>
        <circle cx="1050" cy="380" r="5.5"/>
        <circle cx="940" cy="300" r="4.5"/>
        <circle cx="150" cy="1180" r="4"/>
        <circle cx="470" cy="1120" r="4.5"/>
        <circle cx="440" cy="1320" r="4"/>
      </g>
      <circle cx="1040" cy="230" r="24" fill="url(#node)"/>
      <circle cx="940" cy="300" r="20" fill="url(#node)"/>
      <circle cx="470" cy="1120" r="20" fill="url(#node)"/>

      <!-- data bars accent -->
      <g opacity="0.92">
        <rect x="770" y="470" width="18" height="60" rx="4" fill="#3a6bd6"/>
        <rect x="798" y="440" width="18" height="90" rx="4" fill="#4f86ff"/>
        <rect x="826" y="456" width="18" height="74" rx="4" fill="#6f9dff"/>
        <rect x="854" y="410" width="18" height="120" rx="4" fill="#35E0E8"/>
      </g>
    </svg>

    <div class="hud tl"></div>
    <div class="hud tr"></div>
    <div class="hud bl"></div>
    <div class="hud br"></div>

    <div class="cert">
      <span class="badge">获奖证书</span>
      <img src="../images/certificate-first-prize.png" alt="InfiniSynapse × CSDN 获奖证书">
    </div>

    <div class="content">
      <div class="top"><span class="dot"></span><b>InfiniSynapse</b><span class="x">×</span><b>CSDN</b><span>Vibe Coding 大赛</span></div>

      <div class="hook">简历「项目经历」还是 <span class="strike">一片空白</span>？</div>

      <h1><span class="gold">一个周末</span><br>做出一个能<br><span class="hl">写进简历</span>的<br>AI 数据应用</h1>

      <div class="sub">界面用 <span class="em">Vibe Coding</span> 快速搭，<br>数据分析交给 <span class="em">InfiniSynapse API</span>。</div>

      <div class="spacer"></div>

      <div class="tags">
        <span class="tag gold">上线应用 &gt; 课设 Demo</span>
        <span class="tag cyan">联名获奖证书</span>
        <span class="tag">注册送 500 积分</span>
      </div>

      <div class="foot">
        <span class="bar"></span>
        面向高校师生 · 不设门槛 · 一人也能参赛
      </div>
    </div>
  </div>
</body>
</html>
