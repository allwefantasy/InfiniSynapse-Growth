<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cyan: #35E0E8;
    --gold: #F2C14E;
  }
  body { background: #fff; }

  .poster {
    position: relative; width: 1080px; height: 1440px; overflow: hidden;
    background: #070b16;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    color: #fff;
  }

  .glow {
    position: absolute; width: 980px; height: 780px;
    left: 50%; top: -140px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(46,107,255,0.26) 0%, transparent 68%);
  }
  .glow2 {
    position: absolute; width: 640px; height: 480px;
    right: -80px; bottom: 120px;
    background: radial-gradient(ellipse, rgba(53,224,232,0.1) 0%, transparent 70%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,150,220,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,150,220,0.05) 1px, transparent 1px);
    background-size: 54px 54px;
    opacity: 0.75;
  }

  .hud { position:absolute; width:36px; height:36px; border:2px solid rgba(120,160,255,0.35); z-index:5; }
  .hud.tl { top:34px; left:34px; border-right:none; border-bottom:none; }
  .hud.tr { top:34px; right:34px; border-left:none; border-bottom:none; }
  .hud.bl { bottom:34px; left:34px; border-right:none; border-top:none; }
  .hud.br { bottom:34px; right:34px; border-left:none; border-top:none; }

  .wrap {
    position: relative; z-index: 4; height: 100%;
    padding: 56px 64px 44px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    justify-content: space-between;
  }

  .top {
    display: flex; flex-direction: column; align-items: center;
  }

  .brand {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 10px 24px; border-radius: 999px;
    font-size: 24px; color: #cdd9ff;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .brand b { color: #fff; font-weight: 700; }
  .brand .x { color: #7f93c8; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
  }

  .subtitle {
    margin-top: 18px; font-size: 26px; color: #9aa8c7; letter-spacing: 2px;
  }

  .kicker {
    margin-top: 24px; font-size: 28px; font-weight: 600;
    color: var(--gold); letter-spacing: 8px;
  }

  .count {
    margin-top: 4px; display: flex; align-items: baseline; justify-content: center; gap: 14px;
  }
  .count .num {
    font-size: 220px; font-weight: 900; line-height: 0.88; color: var(--cyan);
    text-shadow: 0 0 50px rgba(53,224,232,0.4);
    font-family: "SF Pro Display", -apple-system, sans-serif;
  }
  .count .unit {
    font-size: 68px; font-weight: 800; color: #8fb2ff;
  }

  .deadline {
    margin-top: 6px; font-size: 30px; color: #d7def0; font-weight: 600;
  }
  .deadline b { color: var(--gold); }

  .mid {
    width: 100%;
    display: flex; flex-direction: column; gap: 20px;
  }

  .banner {
    width: 100%; padding: 24px 26px; border-radius: 18px;
    background: rgba(46,107,255,0.18);
    border: 1px solid rgba(120,160,255,0.35);
  }
  .banner .big { font-size: 34px; font-weight: 800; letter-spacing: 1px; }
  .banner .big em {
    font-style: normal; color: #1b1206;
    background: var(--gold); padding: 2px 12px; border-radius: 8px;
  }
  .banner .sub { margin-top: 10px; font-size: 24px; color: #c5d0ea; }

  .prizes {
    width: 100%;
    padding: 26px 22px 24px;
    border-radius: 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .prizes-head {
    display: flex; align-items: baseline; justify-content: center; gap: 14px;
    margin-bottom: 20px;
  }
  .prizes-head .label {
    font-size: 24px; color: #9aa8c7; font-weight: 600;
  }
  .prizes-head .total {
    font-size: 42px; font-weight: 900; color: var(--gold);
  }
  .prizes-head .unit {
    font-size: 22px; color: #9aa8c7;
  }

  .prize-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
  }
  .prize {
    padding: 20px 10px 18px;
    border-radius: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .prize .tier {
    font-size: 22px; font-weight: 700; color: #c5d0ea;
  }
  .prize .amt {
    margin-top: 8px; font-size: 36px; font-weight: 900; color: #fff;
  }
  .prize .amt span { font-size: 22px; font-weight: 700; color: var(--gold); }
  .prize .slots {
    margin-top: 6px; font-size: 20px; color: #7f93c8;
  }
  .prize.first {
    background: rgba(242,193,78,0.1);
    border-color: rgba(242,193,78,0.35);
  }
  .prize.first .tier { color: var(--gold); }
  .prize.first .amt { color: var(--gold); }

  .extra {
    margin-top: 16px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .extra .item {
    padding: 16px 16px; border-radius: 14px;
    background: rgba(53,224,232,0.06);
    border: 1px solid rgba(53,224,232,0.22);
    font-size: 22px; color: #c5d0ea; text-align: left;
  }
  .extra .item b { color: var(--cyan); font-weight: 800; }

  .cert {
    margin-top: 14px;
    font-size: 22px; color: #9aa8c7;
  }
  .cert b { color: #fff; }

  .qr-block {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .qr-card {
    padding: 12px; border-radius: 16px;
    background: #fff;
    box-shadow: 0 0 28px rgba(53,224,232,0.15);
  }
  .qr-card img {
    width: 156px; height: 156px; display: block;
    object-fit: contain;
  }
  .qr-label {
    font-size: 28px; font-weight: 700; color: #fff;
  }
  .qr-label .c { color: var(--cyan); }
  .qr-hint {
    font-size: 22px; color: #9aa8c7;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="grid"></div>
    <div class="hud tl"></div><div class="hud tr"></div>
    <div class="hud bl"></div><div class="hud br"></div>

    <div class="wrap">
      <div class="top">
        <div class="brand"><span class="dot"></span><b>InfiniSynapse</b><span class="x">×</span><b>CSDN</b></div>
        <div class="subtitle">Vibe Coding 泛数据分析应用开发大赛</div>

        <div class="kicker">距 提 交 截 止</div>
        <div class="count"><span class="num">10</span><span class="unit">天</span></div>
        <div class="deadline">提交截止：<b>7 月 31 日</b></div>
      </div>

      <div class="mid">
        <div class="banner">
          <div class="big">参与奖 50 名额<em>尚未坐满</em></div>
          <div class="sub">交一个能跑的作品，拿奖概率很高</div>
        </div>

        <div class="prizes">
          <div class="prizes-head">
            <span class="label">现金奖金池</span>
            <span class="total">¥22,528</span>
            <span class="unit">+ 会员权益</span>
          </div>
          <div class="prize-row">
            <div class="prize first">
              <div class="tier">一等奖</div>
              <div class="amt"><span>¥</span>4,096</div>
              <div class="slots">2 名 · 含年度 Pro</div>
            </div>
            <div class="prize">
              <div class="tier">二等奖</div>
              <div class="amt"><span>¥</span>2,048</div>
              <div class="slots">4 名 · 含会员权益</div>
            </div>
            <div class="prize">
              <div class="tier">三等奖</div>
              <div class="amt"><span>¥</span>1,024</div>
              <div class="slots">6 名 · 含会员权益</div>
            </div>
          </div>
          <div class="extra">
            <div class="item">参与奖 <b>50 名</b> · 月度 Pro ¥150</div>
            <div class="item">注册即送 <b>500 积分</b> 开发额度</div>
          </div>
          <div class="cert">另赠 <b>InfiniSynapse × CSDN 联名获奖证书</b></div>
        </div>
      </div>

      <div class="qr-block">
        <div class="qr-card">
          <img src="wechat-group-qr.png" alt="活动群二维码">
        </div>
        <div class="qr-label">扫码加入<span class="c">大赛活动群</span></div>
        <div class="qr-hint">技术答疑 · 进度打卡 · 赛事通知</div>
      </div>
    </div>
  </div>
</body>
</html>
