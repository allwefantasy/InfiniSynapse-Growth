<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cyan: #35E0E8;
    --gold: #F2C14E;
  }
  body { background: #fff; }

  .poster {
    position: relative; width: 1080px; min-height: 1920px;
    background: #070b16;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    color: #fff;
  }

  .glow {
    position: absolute; width: 980px; height: 760px;
    left: 50%; top: -140px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(46,107,255,0.24) 0%, transparent 68%);
    pointer-events: none;
  }
  .glow2 {
    position: absolute; width: 700px; height: 500px;
    right: -100px; bottom: 200px;
    background: radial-gradient(ellipse, rgba(53,224,232,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,150,220,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,150,220,0.05) 1px, transparent 1px);
    background-size: 54px 54px;
    opacity: 0.7;
    pointer-events: none;
  }

  .wrap {
    position: relative; z-index: 4;
    padding: 80px 64px 72px;
    display: flex; flex-direction: column;
  }

  .brand {
    align-self: center;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 26px; border-radius: 999px;
    font-size: 24px; color: #cdd9ff;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .brand b { color: #fff; font-weight: 700; }
  .brand .x { color: #7f93c8; }
  .brand .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
  }

  .eyebrow {
    margin-top: 36px; text-align: center;
    font-size: 26px; color: var(--gold); letter-spacing: 5px; font-weight: 600;
  }
  .title {
    margin-top: 16px; text-align: center;
    font-size: 60px; font-weight: 900; letter-spacing: 2px; line-height: 1.2;
  }
  .title .c { color: var(--cyan); }
  .desc {
    margin-top: 18px; text-align: center;
    font-size: 28px; color: #9aa8c7; line-height: 1.5;
  }

  .shots {
    margin-top: 48px;
    display: flex; flex-direction: column; gap: 40px;
  }

  .shot-block {}
  .shot-label {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
    padding: 0 4px;
  }
  .shot-label .pill {
    font-size: 20px; font-weight: 700; color: #070b16;
    background: var(--cyan); padding: 5px 14px; border-radius: 999px;
  }
  .shot-label .txt {
    font-size: 24px; color: #c5d0ea; font-weight: 600;
  }

  .shot {
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid rgba(120,160,255,0.28);
    background: #fff;
    box-shadow: 0 18px 48px rgba(0,0,0,0.35);
  }
  .shot img {
    width: 100%;
    height: auto;
    display: block;
    vertical-align: top;
  }

  .points {
    margin-top: 48px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
  }
  .point {
    padding: 28px 16px; border-radius: 18px; text-align: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .point .v {
    font-size: 34px; font-weight: 800; color: var(--cyan);
  }
  .point .l {
    margin-top: 10px; font-size: 22px; color: #9aa8c7;
  }

  .cta-box {
    margin-top: 36px;
    padding: 32px 28px; border-radius: 20px;
    background: rgba(46,107,255,0.18);
    border: 1px solid rgba(120,160,255,0.35);
    text-align: center;
  }
  .cta-box .main {
    font-size: 36px; font-weight: 800;
  }
  .cta-box .main em {
    font-style: normal; color: #1b1206;
    background: var(--gold); padding: 2px 14px; border-radius: 8px;
  }
  .cta-box .sub {
    margin-top: 14px; font-size: 26px; color: #c5d0ea;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="grid"></div>

    <div class="wrap">
      <div class="brand"><span class="dot"></span><b>InfiniSynapse</b><span class="x">×</span><b>CSDN</b></div>

      <div class="eyebrow">比赛作品长廊上线</div>
      <div class="title">先逛长廊<br>再动手<span class="c">交作品</span></div>
      <div class="desc">精选作品可体验、可投票<br>看看别人做成什么样，照着改也能交</div>

      <div class="shots">
        <div class="shot-block">
          <div class="shot-label">
            <span class="pill">01</span>
            <span class="txt">长廊首页 · 精选作品一览</span>
          </div>
          <div class="shot">
            <img src="samples/gallery-hero.png" alt="比赛作品长廊首页">
          </div>
        </div>

        <div class="shot-block">
          <div class="shot-label">
            <span class="pill">02</span>
            <span class="txt">作品列表 · 体验 / 投票 / 抄作业</span>
          </div>
          <div class="shot">
            <img src="samples/gallery-grid.png" alt="作品长廊列表">
          </div>
        </div>
      </div>

      <div class="points">
        <div class="point"><div class="v">可体验</div><div class="l">点开就能玩</div></div>
        <div class="point"><div class="v">可投票</div><div class="l">支持喜欢的作品</div></div>
        <div class="point"><div class="v">可抄作业</div><div class="l">找灵感直接改</div></div>
      </div>

      <div class="cta-box">
        <div class="main">作品长廊已开放 · <em>去逛逛</em></div>
        <div class="sub">截止日期 7 月 31 日 · 参与奖名额尚未坐满</div>
      </div>
    </div>
  </div>
</body>
</html>
