<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111111;
    --muted: #3a3a3a;
    --accent: #111111;
  }
  body { background: #fff; }

  .poster {
    position: relative;
    width: 1080px; height: 1080px;
    overflow: hidden;
    background: #ffffff;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
  }

  /* 作品长廊平铺背景 */
  .bg-collage {
    position: absolute; inset: 0;
    z-index: 0;
    background: #f5f5f5 url("samples/bg/gallery-tile-bg-square.png") center / cover no-repeat;
    filter: saturate(1.12) contrast(1.08);
  }

  .veil {
    position: absolute; inset: 0;
    z-index: 1;
    background:
      linear-gradient(180deg,
        rgba(255,255,255,0.54) 0%,
        rgba(255,255,255,0.40) 28%,
        rgba(255,255,255,0.36) 55%,
        rgba(255,255,255,0.56) 100%),
      radial-gradient(ellipse 75% 52% at 50% 36%, rgba(255,255,255,0.32) 0%, transparent 70%);
  }

  .wrap {
    position: relative; z-index: 3;
    height: 100%;
    padding: 32px 20px 18px;
    display: flex; flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .brand {
    display: flex; align-items: center; justify-content: center;
    gap: 14px;
    margin-bottom: 8px;
  }
  .brand img { height: 38px; width: auto; display: block; }
  .brand .x {
    font-size: 22px; font-weight: 800;
    color: #333;
    line-height: 1;
    padding: 0 2px;
  }

  .live-tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 800;
    letter-spacing: 4px;
    color: #c0392b;
    margin: 22px 0 10px;
  }
  .live-tag .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #e74c3c;
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(231,76,60,0.45); }
    70% { box-shadow: 0 0 0 10px rgba(231,76,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); }
  }

  .eyebrow {
    font-size: 26px; font-weight: 800;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .hero {
    font-size: 60px; font-weight: 900;
    line-height: 1.1;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255,255,255,0.95), 0 0 20px rgba(255,255,255,0.8);
  }
  .hero em {
    font-style: normal;
    color: var(--ink);
  }

  .sub {
    margin-top: 10px;
    font-size: 22px; font-weight: 700;
    color: var(--muted);
  }
  .sub b { color: var(--ink); font-weight: 900; }

  .stage {
    margin-top: 0;
    width: 100%;
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
  }

  .portrait-wrap {
    position: relative;
    flex: 0 0 540px;
    width: 540px;
    max-width: 540px;
    height: 420px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow: visible;
  }
  .portrait-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center top;
    display: block;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.12));
  }

  .side {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 16px;
    background: rgba(255,255,255,0.78);
    border: 1px solid rgba(0,0,0,0.06);
  }

  .badge {
    display: inline-flex;
    flex-direction: column;
    gap: 2px;
    align-self: flex-start;
    padding: 12px 14px;
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    background: #fff;
  }
  .badge .who {
    font-size: 24px; font-weight: 900;
    color: var(--ink);
  }
  .badge .who em {
    font-style: normal;
    color: var(--accent);
    margin-right: 6px;
    font-size: 15px;
    font-weight: 800;
  }
  .badge .role {
    font-size: 15px; font-weight: 700;
    color: var(--muted);
  }

  .time {
    font-size: 30px; font-weight: 900;
    color: var(--ink);
    line-height: 1.25;
  }
  .time span { color: var(--accent); }
  .coop {
    font-size: 20px; font-weight: 700;
    color: var(--muted);
  }
  .coop b { color: var(--ink); }

  .points {
    display: flex; flex-direction: column; gap: 10px;
  }
  .points .line {
    font-size: 19px; font-weight: 700;
    line-height: 1.35;
    color: var(--ink);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .points .line i {
    flex: 0 0 auto;
    margin-top: 9px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    font-style: normal;
  }

  .qr-row {
    margin-top: auto;
    padding-top: 8px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 36px;
  }
  .qr-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    max-width: 300px;
  }
  .qr-block img {
    width: 112px;
    height: 112px;
    object-fit: contain;
    display: block;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 5px 16px rgba(0,0,0,0.10);
  }
  .qr-block .cta {
    font-size: 15px; font-weight: 900;
    letter-spacing: 0.5px;
    color: var(--ink);
    line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="bg-collage"></div>
    <div class="veil"></div>

    <div class="wrap">
      <div class="brand">
        <img src="samples/brands/cert-logo-infinisynapse.png" alt="InfiniSynapse">
        <span class="x">×</span>
        <img src="samples/brands/cert-logo-csdn.png" alt="CSDN">
      </div>

      <div class="live-tag"><i class="dot"></i>联合直播</div>

      <div class="eyebrow">近百个 Vibe Coding 作品之后</div>
      <h1 class="hero">真正可用的 Agent<br>靠 <em>Data Infra</em> 撑起来</h1>
      <p class="sub">站在 <b>InfiniSynapse</b> 视角一起拆</p>

      <div class="stage">
        <div class="portrait-wrap">
          <img src="samples/jiangtao-portrait.png" alt="蒋涛">
        </div>

        <div class="side">
          <div class="badge">
            <div class="who"><em>重磅嘉宾</em>蒋涛</div>
            <div class="role">CSDN 创始人 & 董事长</div>
          </div>
          <div class="time">8/6 周四<br><span>19:00–20:00</span></div>
          <div class="coop"><b>InfiniSynapse</b> × InsCode 同台</div>
          <div class="points">
            <div class="line"><i></i><span>接真实数据、跑得动长任务</span></div>
            <div class="line"><i></i><span>工作流 · 失败重试 · 记忆管理</span></div>
            <div class="line"><i></i><span>从 Vibe Coding 走到可落地应用</span></div>
          </div>
        </div>
      </div>

      <div class="qr-row">
        <div class="qr-block">
          <img src="samples/live-reserve-qr.png" alt="预约直播二维码">
          <div class="cta">扫码预约直播</div>
        </div>
        <div class="qr-block">
          <img src="samples/live-qr.png" alt="开发者社区二维码">
          <div class="cta">扫码进入开发者社区<br>随时了解更多行业动态</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
