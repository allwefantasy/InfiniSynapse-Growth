<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cyan: #35E0E8;
    --gold: #F2C14E;
  }
  body { background: #fff; }

  .poster {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: #070b16;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    color: #fff;
  }

  .glow {
    position: absolute; width: 900px; height: 700px;
    left: 50%; top: -120px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(46,107,255,0.22) 0%, transparent 68%);
  }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,150,220,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,150,220,0.05) 1px, transparent 1px);
    background-size: 54px 54px;
    opacity: 0.7;
  }

  .hud { position:absolute; width:36px; height:36px; border:2px solid rgba(120,160,255,0.35); z-index:5; }
  .hud.tl { top:34px; left:34px; border-right:none; border-bottom:none; }
  .hud.tr { top:34px; right:34px; border-left:none; border-bottom:none; }
  .hud.bl { bottom:34px; left:34px; border-right:none; border-top:none; }
  .hud.br { bottom:34px; right:34px; border-left:none; border-top:none; }

  .wrap {
    position: relative; z-index: 4; height: 100%;
    padding: 72px 72px 56px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }

  .brand {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 10px 24px; border-radius: 999px;
    font-size: 24px; letter-spacing: 0.5px; color: #cdd9ff;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .brand b { color: #fff; font-weight: 700; }
  .brand .x { color: #7f93c8; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
  }

  .subtitle {
    margin-top: 16px; font-size: 28px; color: #9aa8c7; letter-spacing: 2px;
  }

  .kicker {
    margin-top: 40px; font-size: 32px; font-weight: 600;
    color: var(--gold); letter-spacing: 8px;
  }

  .count {
    margin-top: 4px; display: flex; align-items: baseline; justify-content: center; gap: 16px;
  }
  .count .num {
    font-size: 260px; font-weight: 900; line-height: 0.92; color: var(--cyan);
    text-shadow: 0 0 50px rgba(53,224,232,0.4);
    font-family: "SF Pro Display", -apple-system, sans-serif;
  }
  .count .unit {
    font-size: 72px; font-weight: 800; color: #8fb2ff;
  }
  .deadline {
    margin-top: 4px; font-size: 34px; color: #d7def0; font-weight: 600; letter-spacing: 2px;
  }
  .deadline b { color: var(--gold); }

  .banner {
    margin-top: 28px; width: 100%; padding: 24px 26px; border-radius: 18px;
    background: rgba(46,107,255,0.18);
    border: 1px solid rgba(120,160,255,0.35);
  }
  .banner .big { font-size: 42px; font-weight: 800; letter-spacing: 1px; }
  .banner .big em {
    font-style: normal; color: #1b1206;
    background: var(--gold); padding: 2px 14px; border-radius: 10px;
  }
  .banner .sub { margin-top: 10px; font-size: 26px; color: #c5d0ea; }

  .stats { margin-top: 22px; width: 100%; display: flex; justify-content: space-between; gap: 16px; }
  .stat {
    flex: 1; padding: 20px 10px; border-radius: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .stat .v { font-size: 44px; font-weight: 800; color: #fff; }
  .stat .v.go { color: var(--gold); }
  .stat .v.cy { color: var(--cyan); }
  .stat .l { margin-top: 6px; font-size: 22px; color: #9aa8c7; letter-spacing: 1px; }

  .qr-block {
    margin-top: auto;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .qr-card {
    padding: 12px; border-radius: 16px;
    background: #fff;
    box-shadow: 0 0 28px rgba(53,224,232,0.15);
  }
  .qr-card img {
    width: 180px; height: 180px; display: block;
    object-fit: contain;
  }
  .qr-label {
    font-size: 28px; font-weight: 700; color: #fff;
  }
  .qr-label .c { color: var(--cyan); }
  .qr-hint {
    font-size: 20px; color: #9aa8c7;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="hud tl"></div><div class="hud tr"></div><div class="hud bl"></div><div class="hud br"></div>

    <div class="wrap">
      <div class="brand"><span class="dot"></span><b>InfiniSynapse</b><span class="x">×</span><b>CSDN</b></div>
      <div class="subtitle">Vibe Coding 泛数据分析应用开发大赛</div>

      <div class="kicker">距 提 交 截 止</div>
      <div class="count"><span class="num">11</span><span class="unit">天</span></div>
      <div class="deadline">提交截止：<b>7 月 31 日</b></div>

      <div class="banner">
        <div class="big">参与奖 50 名额<em>尚未坐满</em></div>
        <div class="sub">现在提交一个达标作品，大概率有奖</div>
      </div>

      <div class="stats">
        <div class="stat"><div class="v">80+</div><div class="l">已报名</div></div>
        <div class="stat"><div class="v go">50</div><div class="l">参与奖名额</div></div>
        <div class="stat"><div class="v cy">一个周末</div><div class="l">即可完成</div></div>
      </div>

      <div class="qr-block">
        <div class="qr-card">
          <img src="wechat-group-qr.png" alt="活动群二维码">
        </div>
        <div class="qr-label">扫码加入<span class="c">大赛活动群</span></div>
        <div class="qr-hint">技术答疑 · 进度打卡 · 赛事通知</div>
      </div>
    </div>
  </div>
</body>
</html>
