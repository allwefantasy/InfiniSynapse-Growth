<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cyan: #35E0E8;
    --gold: #F2C14E;
    --gold2: #FFE39A;
    --ink: #1b1206;
  }
  body { background: #fff; }

  .poster {
    position: relative; width: 1080px; height: 1440px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    color: #fff;
    background: #12080a;
  }

  .bg {
    position: absolute; inset: 0;
    background:
      url("samples/finale-trophy-bg.png") center 42% / cover no-repeat;
    transform: scale(1.04);
  }
  /* 单层长过渡遮罩：中段几乎全透，暗部压到卡片区以下再缓入 */
  .veil-top {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg,
        rgba(12,6,8,0.48) 0%,
        rgba(12,6,8,0.22) 12%,
        rgba(12,6,8,0.06) 22%,
        rgba(12,6,8,0.00) 32%,
        rgba(12,6,8,0.00) 58%,
        rgba(10,5,6,0.04) 68%,
        rgba(10,5,6,0.14) 76%,
        rgba(10,5,6,0.36) 84%,
        rgba(10,5,6,0.68) 92%,
        rgba(10,5,6,0.88) 100%);
    pointer-events: none;
  }
  .veil-mid { display: none; }
  .veil-bot { display: none; }
  .tech-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,220,140,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,220,140,0.04) 1px, transparent 1px);
    background-size: 54px 54px;
    opacity: 0.55; pointer-events: none;
    mix-blend-mode: soft-light;
  }
  .glow {
    position: absolute; left: 50%; top: 38%;
    width: 680px; height: 420px; margin-left: -340px;
    background: radial-gradient(ellipse, rgba(255,200,80,0.22) 0%, transparent 70%);
    pointer-events: none;
  }

  .wrap {
    position: relative; z-index: 4; height: 100%;
    padding: 44px 42px 36px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }

  .logos {
    position: relative;
    z-index: 2;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 18px 36px 16px;
    border: none;
    background: transparent;
    box-shadow: none;
  }
  .logos-glow {
    position: absolute;
    left: 50%; top: 50%;
    width: 780px; height: 140px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      rgba(255, 248, 235, 0.72) 0%,
      rgba(255, 236, 200, 0.38) 34%,
      rgba(255, 220, 160, 0.12) 58%,
      transparent 76%);
    filter: blur(1.5px);
    z-index: -1;
    pointer-events: none;
  }
  .logos .host {
    font-size: 20px; font-weight: 800; color: #1a2744; letter-spacing: 1px;
    margin-right: 4px; white-space: nowrap;
    text-shadow: 0 1px 0 rgba(255,255,255,0.35);
  }
  .logos .is img {
    height: 44px; width: auto; display: block;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,0.25));
  }
  .logos .csdn img {
    height: 44px; width: auto; display: block;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,0.25));
  }
  .logos .x {
    font-size: 24px; font-weight: 800; color: #6e5a3d;
    padding: 0 2px;
  }

  .eyebrow {
    margin-top: 28px;
    font-size: 42px; font-weight: 700;
    color: rgba(255,240,210,0.9);
    letter-spacing: 2px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.55);
  }
  .theme {
    margin-top: 12px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 26px;
    border-radius: 999px;
    font-size: 34px; font-weight: 800;
    color: #FFF6E0;
    letter-spacing: 1px;
    background: rgba(12,7,8,0.28);
    border: 1px solid rgba(255,210,120,0.35);
    box-shadow: 0 0 24px rgba(255,190,70,0.12);
    text-shadow: 0 2px 10px rgba(0,0,0,0.45);
  }
  .theme .c { color: var(--cyan); }
  .theme .g { color: var(--gold2); }
  .hero-wrap {
    position: relative;
    margin-top: 16px;
    padding: 8px 24px 10px;
    display: grid;
    place-items: center;
  }
  .hero-back,
  .hero {
    grid-area: 1 / 1;
    font-size: 176px; font-weight: 900; line-height: 1;
    letter-spacing: 16px;
    text-align: center;
  }
  .hero-back {
    z-index: 1;
    color: transparent;
    -webkit-text-stroke: 7px rgba(12,6,8,0.65);
    filter:
      drop-shadow(0 4px 6px rgba(0,0,0,0.35))
      drop-shadow(0 10px 18px rgba(0,0,0,0.28));
    user-select: none;
    pointer-events: none;
  }
  .hero {
    position: relative;
    z-index: 2;
    color: #F2C14E;
    background: linear-gradient(180deg, #FFF6D0 0%, #FFE39A 28%, #F2C14E 62%, #E8A820 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 0 rgba(10,5,6,0.35)) drop-shadow(0 8px 18px rgba(0,0,0,0.4));
  }
  .hero em,
  .hero-back em {
    font-style: normal;
    color: inherit;
    -webkit-text-stroke: inherit;
  }
  .hero em {
    background: inherit;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    margin-top: 14px;
    font-size: 26px; font-weight: 700;
    color: rgba(255,245,220,0.95);
    text-shadow: 0 2px 10px rgba(0,0,0,0.55);
  }
  .sub b { color: var(--gold2); }

  .spacer { flex: 1; min-height: 260px; }

  .bottom {
    position: relative;
    width: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 28px;
  }
  .bottom::before {
    content: "";
    position: absolute; left: -42px; right: -42px; top: -80px; height: 140px;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(10,5,6,0.08) 45%,
      rgba(10,5,6,0.18) 100%);
    pointer-events: none;
    z-index: 0;
  }
  .bottom > * { position: relative; z-index: 1; }

  .stats {
    width: 100%;
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  .stat {
    padding: 22px 16px 18px;
    border-radius: 22px;
    background: rgba(12,7,8,0.48);
    border: 1px solid rgba(255,210,120,0.32);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.28);
  }
  .stat.hot {
    border-color: rgba(53,224,232,0.42);
    box-shadow: 0 10px 28px rgba(0,0,0,0.28), 0 0 24px rgba(53,224,232,0.10);
  }
  .stat .label {
    font-size: 22px; font-weight: 800; letter-spacing: 2px;
    color: rgba(255,235,190,0.92);
  }
  .stat .num {
    margin-top: 6px;
    font-size: 84px; font-weight: 900; line-height: 1;
    color: var(--gold2);
    text-shadow: 0 0 24px rgba(255,190,60,0.4);
  }
  .stat.hot .num {
    color: var(--cyan);
    text-shadow: 0 0 24px rgba(53,224,232,0.45);
  }
  .stat .num span { font-size: 36px; margin-left: 2px; }
  .stat .note {
    margin-top: 8px; font-size: 18px; font-weight: 600;
    color: rgba(230,210,180,0.78);
  }

  .next {
    margin-top: 18px; width: 100%;
    padding: 22px 22px 20px;
    border-radius: 22px;
    background: linear-gradient(105deg,
      rgba(20,8,8,0.58),
      rgba(40,18,8,0.52) 50%,
      rgba(10,24,28,0.55));
    border: 1px solid rgba(255,210,120,0.32);
    backdrop-filter: blur(12px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.28);
  }
  .next .big {
    margin-top: 0;
    font-size: 34px; font-weight: 900; line-height: 1.35;
    color: #FFF6E0;
    text-shadow: 0 2px 12px rgba(0,0,0,0.45);
  }
  .next .big em {
    font-style: normal; color: var(--cyan);
    text-shadow: 0 0 16px rgba(53,224,232,0.35);
  }
  .next .small {
    margin-top: 8px;
    font-size: 20px; font-weight: 600;
    color: rgba(235,215,180,0.82);
  }

  .foot {
    margin-top: 18px;
    font-size: 26px; font-weight: 800;
    color: #FFF0D0;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .foot .g { color: var(--gold2); }
  .foot .c { color: var(--cyan); }
  .link {
    margin-top: 8px;
    font-size: 18px;
    color: rgba(255,230,180,0.5);
    font-family: "SF Mono", Menlo, monospace;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="bg"></div>
    <div class="tech-grid"></div>
    <div class="glow"></div>
    <div class="veil-top"></div>
    <div class="veil-mid"></div>
    <div class="veil-bot"></div>

    <div class="wrap">
      <div class="logos">
        <div class="logos-glow"></div>
        <div class="host">主办方</div>
        <div class="is"><img src="samples/brands/cert-logo-infinisynapse.png" alt="InfiniSynapse"></div>
        <div class="x">×</div>
        <div class="csdn"><img src="samples/brands/cert-logo-csdn.png" alt="CSDN"></div>
      </div>

      <div class="eyebrow">Vibe Coding 泛数据分析应用开发大赛</div>
      <div class="theme">主题：<span class="g">让</span> <span class="c">Data Infra</span> <span class="g">创造无限可能</span></div>
      <div class="hero-wrap">
        <div class="hero-back" aria-hidden="true">圆满<em>收官</em></div>
        <div class="hero">圆满<em>收官</em></div>
      </div>
      <div class="sub">感谢每一位参赛开发者 · <b>作品已全部就位</b></div>

      <div class="spacer"></div>

      <div class="bottom">
        <div class="stats">
          <div class="stat">
            <div class="label">累计报名</div>
            <div class="num">243</div>
            <div class="note">开发者报名参与</div>
          </div>
          <div class="stat hot">
            <div class="label">累计提交</div>
            <div class="num">100<span>+</span></div>
            <div class="note">真实可体验作品</div>
          </div>
        </div>

        <div class="next">
          <div class="big"><em>8 月第一周</em> 开始进行分数评审</div>
          <div class="small">评审结果与获奖名单将另行公布，请持续关注</div>
        </div>

        <div class="foot">交卷完成 · <span class="g">评审开启</span> · <span class="c">敬请期待</span></div>
        <div class="link">https://infinisynapse.cn/contest/vibe-coding/gallery</div>
      </div>
    </div>
  </div>
</body>
</html>
