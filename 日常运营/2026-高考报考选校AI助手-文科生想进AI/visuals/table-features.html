<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 680px;
      margin: 0;
      padding: 32px;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      color: #333;
    }
    .card {
      border: 1px solid #e6eaf2;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(30, 111, 255, 0.08);
    }
    .title {
      background: linear-gradient(135deg, #1e6fff, #4a8aff);
      color: #fff;
      padding: 18px 24px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .subtitle {
      padding: 12px 24px 0;
      font-size: 13px;
      color: #64748b;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      padding: 16px 24px;
      font-size: 15px;
      line-height: 1.65;
      border-bottom: 1px solid #f0f3f8;
      vertical-align: top;
      text-align: left;
    }
    th {
      background: #f5f8ff;
      color: #1e6fff;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.04em;
    }
    tr:last-child td { border-bottom: none; }
    td:first-child {
      width: 34%;
      font-weight: 600;
      color: #1e293b;
    }
    td:last-child { color: #475569; }
    .highlight {
      color: #1e6fff;
      font-weight: 600;
    }
    .footnote {
      padding: 14px 24px 18px;
      background: #fafbff;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">你能得到什么</div>
    <div class="subtitle">高考报考选校 AI 助手 · 免登录版能力一览</div>
    <table>
      <thead>
        <tr>
          <th>能力</th>
          <th>说明</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>报考分析 PDF</td>
          <td>输入省份、估分/位次、目标院校或专业，一键生成预演报告；出分后可再跑正式版</td>
        </tr>
        <tr>
          <td>冲稳保梯度</td>
          <td>冲刺 / 稳妥 / 保底分层，附风险说明</td>
        </tr>
        <tr>
          <td>退档与调剂提示</td>
          <td>先判断「能不能冲」，再谈「冲哪所」</td>
        </tr>
        <tr>
          <td>数据缺口标注</td>
          <td>缺年份、缺专业组会标明，方便你对照省考试院和招生章程</td>
        </tr>
        <tr>
          <td>费用与门槛</td>
          <td><span class="highlight">当前免费 · 免注册 · 无需安装插件</span></td>
        </tr>
      </tbody>
    </table>
    <div class="footnote">InfiniSynapse · 高考报考选校 AI 助手</div>
  </div>
</body>
</html>
