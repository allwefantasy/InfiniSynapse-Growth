<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 1080px;
      height: 608px;
      margin: 0;
      padding: 0;
      background: #f7f3ee;
      font-family: Georgia, "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", serif;
      color: #111;
    }
    .page {
      width: 100%;
      height: 100%;
      padding: 52px 64px;
      background:
        linear-gradient(90deg, rgba(50,104,145,0.10), transparent 40%),
        repeating-linear-gradient(0deg, rgba(17,17,17,0.028) 0, rgba(17,17,17,0.028) 1px, transparent 1px, transparent 12px);
      border: 18px solid #fff;
    }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 4px double #111;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 22px;
      font-weight: 700;
    }
    .date {
      font-size: 16px;
      color: #666;
      letter-spacing: 0.02em;
      font-weight: 400;
    }
    h1 {
      margin: 34px 0 18px;
      max-width: 760px;
      font-size: 58px;
      line-height: 1.08;
      letter-spacing: 0;
    }
    .deck {
      max-width: 820px;
      font-size: 23px;
      line-height: 1.55;
      color: #333;
      margin-bottom: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 18px;
    }
    .card {
      min-height: 154px;
      background: rgba(255,255,255,0.82);
      border: 1px solid #d5cfc5;
      padding: 22px 24px;
    }
    .label {
      color: #326891;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }
    .card p {
      margin: 0;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 700;
    }
    .footer {
      position: absolute;
      left: 82px;
      right: 82px;
      bottom: 48px;
      padding-top: 14px;
      border-top: 1px solid rgba(17,17,17,0.22);
      color: #666;
      display: flex;
      justify-content: space-between;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <section class="page">
    <div class="masthead">
      <span>DATA AGENT REVIEW</span>
      <span class="date">InfiniSynapse Notes</span>
    </div>
    <h1>Code Agent 无法替代企业 Data Agent</h1>
    <div class="deck">
      企业数据分析的难点，不是把自然语言翻译成 SQL，而是在动态数据资产、业务口径和证据链中生产可信答案。
    </div>
    <div class="grid">
      <div class="card">
        <div class="label">Code Agent</div>
        <p>目标是让代码跑起来</p>
      </div>
      <div class="card">
        <div class="label">Data Agent</div>
        <p>目标是让答案可信、可复核</p>
      </div>
    </div>
    <div class="footer">
      <span>Search · Source of Truth · Verification</span>
      <span>May 2026</span>
    </div>
  </section>
</body>
</html>
